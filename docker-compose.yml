services:
  api-gateway:
    build:
      context: ./api_gateway_service
      dockerfile: Dockerfile
    container_name: meridian-api-gateway
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=test-secret
      - PROXY_SECRET=test-proxy-secret
      - LOG_LEVEL=info
      - AUTH_EXCLUDE_PATHS=/health,/api/auth/refresh-token,/api/auth/login,/api/auth/register
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - ROUTES=[{"prefix":"/api/auth","target":"http://auth-service:4000"},{"prefix":"/api/dashboard","target":"http://dashboard-service:8002"}]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: meridian-auth-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET=test-secret
      - PROXY_SECRET=test-proxy-secret
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: meridian-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meridian-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - meridian
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meridian-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - meridian
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic bucketnotifications --partitions 4 --replication-factor 1 &&
      echo 'Topic bucketnotifications created with 4 partitions' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic video.queued --partitions 8 --replication-factor 1 &&
      echo 'Topic video.queued created with 8 partitions' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic video.DLQ --partitions 4 --replication-factor 1 &&
      echo 'Topic video.DLQ created with 4 partitions' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic video.retry --partitions 4 --replication-factor 1 &&
      echo 'Topic video.retry created with 4 partitions' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic job.completed --partitions 4 --replication-factor 1 &&
      echo 'Topic job.completed created with 4 partitions' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic job.failed --partitions 4 --replication-factor 1 &&
      echo 'Topic job.failed created with 4 partitions'
      "

  minio:
    image: quay.io/minio/minio:latest
    container_name: meridian-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_NOTIFY_KAFKA_ENABLE_1: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_1: "kafka:29092"
      MINIO_NOTIFY_KAFKA_TOPIC_1: "bucketnotifications"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: meridian-minio-init
    depends_on:
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - meridian
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/viduploads &&
      mc event add myminio/viduploads arn:minio:sqs::1:kafka --event put -p &&
      echo 'MinIO bucket and notification configured'
      "

  video-db:
    image: postgres:16-alpine
    container_name: meridian-video-db
    environment:
      POSTGRES_DB: video_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - video_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  video-service:
    build:
      context: ./video_service
      dockerfile: Dockerfile
    container_name: meridian-video-service
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=bucketnotifications
      - KAFKA_CONSUMER_GROUP_ID=meridian-video-consumer-group
      - KAFKA_AUTO_OFFSET_RESET=earliest
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@video-db:5432/video_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=viduploads
      - PROXY_SECRET=test-proxy-secret
      - LOG_LEVEL=info
    depends_on:
      video-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - meridian
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: meridian-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  celery-worker:
    build:
      context: ./video_service
      dockerfile: Dockerfile.celery
    container_name: meridian-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@video-db:5432/video_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      video-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  celery-beat:
    build:
      context: ./video_service
      dockerfile: Dockerfile.celery
    container_name: meridian-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@video-db:5432/video_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  media-processing-db:
    image: postgres:16-alpine
    container_name: meridian-media-processing-db
    environment:
      POSTGRES_DB: media_processing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - media_processing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_processing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  media-processing-service:
    build:
      context: ./media_processing_service
      dockerfile: Dockerfile
    container_name: meridian-media-processing-service
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=video.queued
      - KAFKA_CONSUMER_GROUP_ID=meridian-media-processing-consumer-group
      - KAFKA_AUTO_OFFSET_RESET=earliest
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@media-processing-db:5432/media_processing_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    depends_on:
      media-processing-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  media-processing-celery-worker:
    build:
      context: ./media_processing_service
      dockerfile: Dockerfile.celery
    container_name: meridian-media-processing-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@media-processing-db:5432/media_processing_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_DOWNLOAD_BUCKET=viduploads
      - MINIO_UPLOAD_BUCKET=vidsegments
      - MINIO_SECURE=false
      - LOG_LEVEL=info
    depends_on:
      media-processing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  media-processing-celery-beat:
    build:
      context: ./media_processing_service
      dockerfile: Dockerfile.celery
    container_name: meridian-media-processing-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@media-processing-db:5432/media_processing_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_DOWNLOAD_BUCKET=viduploads
      - MINIO_UPLOAD_BUCKET=vidsegments
      - MINIO_SECURE=false
      - LOG_LEVEL=info
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

  dashboard-db:
    image: postgres:16-alpine
    container_name: meridian-dashboard-db
    environment:
      POSTGRES_DB: dashboard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meridian
    restart: unless-stopped

  dashboard-service:
    build:
      context: ./dashboard_service
      dockerfile: Dockerfile
    container_name: meridian-dashboard-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@dashboard-db:5432/dashboard_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=4
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_DLQ_TOPIC=video.DLQ
      - KAFKA_RETRY_TOPIC=video.retry
      - KAFKA_CONSUMER_GROUP_ID=meridian-dashboard-consumer-group
      - KAFKA_AUTO_OFFSET_RESET=earliest
      - JWT_SECRET=test-secret
      - PROXY_SECRET=test-proxy-secret
      - LOG_LEVEL=info
    depends_on:
      dashboard-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  auth_db_data:
  video_db_data:
  media_processing_db_data:
  dashboard_db_data:

networks:
  meridian:
    driver: bridge
